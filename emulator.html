<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MoeDex GBA Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            inset: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(220, 38, 38, 0.2);
            border-top-color: #dc2626;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p id="status-text" style="font-size: 15px; font-weight: bold; color: #f87171;">Carregando ROM do IndexedDB...</p>
        <p style="font-size: 12px; color: #9ca3af; max-width: 320px;">Controles: <strong>WASD</strong> (Direcionais), <strong>E</strong> (Botão A), <strong>Shift</strong> (Botão B), <strong>Enter</strong> (Start)</p>
    </div>

    <div id="game"></div>

    <script>
        const DB_NAME = 'moedex_cloud_db_v2';
        const DB_VERSION = 1;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function getFromStore(db, storeName, key) {
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch (e) {
                    resolve(null);
                }
            });
        }

        async function initEmulator() {
            const statusText = document.getElementById('status-text');
            const urlParams = new URLSearchParams(window.location.search);
            const gameCode = urlParams.get('code');

            try {
                const db = await openDB();
                
                let storedRom = null;
                if (gameCode) {
                    storedRom = await getFromStore(db, 'roms', gameCode);
                }

                if (!storedRom || !storedRom.romData) {
                    // Tenta carregar a primeira ROM salva se o código não for especificado
                    const tx = db.transaction('roms', 'readonly');
                    const allReq = tx.objectStore('roms').getAll();
                    allReq.onsuccess = () => {
                        if (allReq.result && allReq.result.length > 0) {
                            startWithRom(allReq.result[0].romData, db, allReq.result[0].gameCode);
                        } else {
                            statusText.innerText = 'Selecione uma ROM na tela anterior para iniciar.';
                        }
                    };
                    return;
                }

                startWithRom(storedRom.romData, db, storedRom.gameCode);
            } catch (e) {
                statusText.innerText = 'Erro ao abrir banco local: ' + e.message;
            }
        }

        async function startWithRom(romData, db, code) {
            const statusText = document.getElementById('status-text');
            const loading = document.getElementById('loading');

            statusText.innerText = 'Iniciando motor GBA...';
            const romBlob = new Blob([romData], { type: 'application/octet-stream' });
            const romUrl = URL.createObjectURL(romBlob);

            // Verificar save anterior
            const existingSave = await getFromStore(db, 'saves', code);

            window.EJS_player = '#game';
            window.EJS_core = 'gba';
            window.EJS_gameUrl = romUrl;
            window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_color = '#dc2626';

            if (existingSave && existingSave.sramData) {
                const sBlob = new Blob([existingSave.sramData], { type: 'application/octet-stream' });
                window.EJS_loadStateURL = URL.createObjectURL(sBlob);
            }

            // Controles: WASD + E (A) + Shift (B)
            window.EJS_defaultControls = {
                0: {
                    'UP': 'KeyW',
                    'DOWN': 'KeyS',
                    'LEFT': 'KeyA',
                    'RIGHT': 'KeyD',
                    'A': 'KeyE',
                    'B': 'ShiftLeft',
                    'L': 'KeyQ',
                    'R': 'KeyR',
                    'START': 'Enter',
                    'SELECT': 'Space'
                }
            };

            window.EJS_onGameStart = function() {
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => { loading.style.display = 'none'; }, 300);
                }
            };

            window.EJS_onSave = function(e) {
                if (e && e.data) {
                    window.parent.postMessage({ type: 'SRAM_UPDATED', sram: e.data, gameCode: code }, '*');
                }
            };

            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js';
            script.async = true;
            document.body.appendChild(script);
        }

        initEmulator();
    </script>
</body>
</html>
